[package]
name = "core-selynt"
version = "1.1.0"
edition = "2024"
authors = ["NullSablex <https://github.com/NullSablex>"]
description = "Selynt Panel — setuid root process manager for DirectAdmin servers"
repository = "https://github.com/NullSablex/core-selynt"
license = "AGPL-3.0-or-later"
keywords = ["process-manager", "directadmin", "selynt"]
categories = ["command-line-utilities"]

[[bin]]
name = "core-selynt"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.6", features = ["derive"] }
nix = { version = "0.31", features = ["signal", "process", "user", "fs"] }
libc = "0.2"
anyhow = "1.0"
thiserror = "2.0"

[profile.release]
strip = true
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
