name: Scorecard

# OpenSSF Scorecard — audits the repository's supply-chain posture (branch
# protection, pinned dependencies, token permissions, workflow hygiene) and
# publishes the findings to the Security tab as SARIF.

on:
  branch_protection_rule:
  schedule:
    # Mondays at 04:30 UTC — off-peak, once a week is enough for a posture scan.
    - cron: '30 4 * * 1'
  push:
    branches:
      - master
  workflow_dispatch:

# Read-only by default; the analysis job widens only what it needs.
permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      # Upload the SARIF result to code scanning.
      security-events: write
      # Read the repository's branch protection settings.
      contents: read
      actions: read
      # OIDC token, required for the publish step below.
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          # Publishes the score so the README badge can resolve it. Only has an
          # effect on the public repository.
          publish_results: true

      # Keep the raw SARIF around: code scanning prunes old runs, this doesn't.
      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        with:
          sarif_file: results.sarif
