name: Scorecard

# OpenSSF Scorecard — audits the repository's supply-chain posture (branch
# protection, pinned dependencies, token permissions, workflow hygiene) and
# publishes the findings to the Security tab as SARIF.

on:
  branch_protection_rule:
  schedule:
    # Mondays at 04:30 UTC — off-peak, once a week is enough for a posture scan.
    - cron: '30 4 * * 1'
  push:
    branches:
      - master
  workflow_dispatch:

# Read-only by default; the analysis job widens only what it needs.
permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      # Upload the SARIF result to code scanning.
      security-events: write
      # Read the repository's branch protection settings.
      contents: read
      actions: read
      # OIDC token, required for the publish step below.
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a # v2.4.3
        with:
          results_file: results.sarif
          results_format: sarif
          # Publishes the score so the README badge can resolve it. Only has an
          # effect on the public repository.
          publish_results: true

      # Keep the raw SARIF around: code scanning prunes old runs, this doesn't.
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        with:
          sarif_file: results.sarif
