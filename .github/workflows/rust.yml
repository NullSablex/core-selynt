name: Rust

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always

# Default: read-only. Each job opts in to extra scopes when needed.
permissions:
  contents: read

jobs:
  build:
    name: Build, test, clippy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install musl tools
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Install Rust (stable + clippy)
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: x86_64-unknown-linux-musl
          components: clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Build
        run: cargo build --target x86_64-unknown-linux-musl --verbose

      - name: Test
        run: cargo test --target x86_64-unknown-linux-musl --verbose

      - name: Clippy (strict)
        # Strict mode: every lint group is denied, not warned. Any finding from
        # `pedantic`, `nursery` or `cargo` fails the build. `--all-targets`
        # covers lib/bin/tests/examples; `--all-features` ensures no
        # feature-gated code is silently skipped.
        run: |
          cargo clippy \
            --target x86_64-unknown-linux-musl \
            --all-targets \
            --all-features \
            -- \
            -D warnings \
            -D clippy::all \
            -D clippy::pedantic \
            -D clippy::nursery \
            -D clippy::cargo

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install Rust (stable + rustfmt)
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    # rustsec/audit-check opens issues for new advisories and posts
    # review comments on PRs that introduce vulnerable dependencies.
    permissions:
      contents: read
      issues: write
      pull-requests: write
      checks: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  coverage:
    name: Coverage (llvm-cov)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install musl tools
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Install Rust (stable + llvm-tools)
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: x86_64-unknown-linux-musl
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@a2a5f6e99e1a31540baa0468acfa302cff0f359f # v2
        with:
          tool: cargo-llvm-cov

      - name: Generate LCOV report
        run: cargo llvm-cov --target x86_64-unknown-linux-musl --lcov --output-path lcov.info

      - name: Upload coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-lcov
          path: lcov.info
          if-no-files-found: error
