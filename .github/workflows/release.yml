name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  BIN_NAME: core-selynt

jobs:
  build-release:
    runs-on: ubuntu-latest
    # Needs write access to create the release and upload the binary.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0   # full history so the generate-notes API can list every commit

      - name: Verify Cargo.toml version matches release tag
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CARGO_VERSION="$(grep -m1 '^version' Cargo.toml | sed 's/.*= *"\(.*\)"/\1/')"
          echo "Release tag:  ${GITHUB_REF_NAME} (version=${TAG_VERSION})"
          echo "Cargo.toml:   ${CARGO_VERSION}"
          if [ "${TAG_VERSION}" != "${CARGO_VERSION}" ]; then
            echo "::error::Release tag (${GITHUB_REF_NAME}) does not match Cargo.toml version (${CARGO_VERSION})."
            echo "::error::Bump Cargo.toml to ${TAG_VERSION} (or retag) and try again."
            exit 1
          fi

      - name: Detect pre-release
        id: prerelease
        run: |
          TAG="${{ github.ref_name }}"
          if echo "$TAG" | grep -qE '\-(alpha|beta|rc)'; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install musl tools
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Cache cargo
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}

      - name: Build (musl static)
        run: cargo build --release --target x86_64-unknown-linux-musl

      - name: Stage release artifacts
        run: |
          mkdir -p dist
          cp "target/x86_64-unknown-linux-musl/release/${BIN_NAME}" "dist/${BIN_NAME}"
          chmod +x "dist/${BIN_NAME}"
          sha256sum "dist/${BIN_NAME}" > "dist/${BIN_NAME}.sha256"

      - name: Build release body
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"

          # 1. Curated section from CHANGELOG.md — headlines, migration notes,
          # breaking changes. Everything that humans wrote and the API cannot
          # infer from PR titles alone.
          BODY=$(awk "/^## \[?v?${VERSION}\]?/{found=1; next} found && /^## /{exit} found{print}" CHANGELOG.md)
          # Fall back to [Unreleased]: the section is often still under that
          # heading at tag time, and shipping the notes beats shipping a stub.
          if [ -z "$(echo "$BODY" | tr -d '[:space:]')" ]; then
            BODY=$(awk '/^## \[Unreleased\]/{found=1; next} found && /^## /{exit} found{print}' CHANGELOG.md)
            if [ -n "$(echo "$BODY" | tr -d '[:space:]')" ]; then
              echo "::warning::CHANGELOG.md has no [${VERSION}] section; used [Unreleased] instead."
            fi
          fi

          if [ -z "$(echo "$BODY" | tr -d '[:space:]')" ]; then
            echo "::error::CHANGELOG.md has neither a [${VERSION}] nor an [Unreleased] section."
            exit 1
          fi

          # 2. Auto-generated notes — used only to borrow the "New Contributors"
          # block and the "Full Changelog" comparison link that GitHub computes
          # natively. The "## What's Changed" categorisation produced here is
          # dropped on purpose; the CHANGELOG already does that job with more
          # context.
          AUTO=$(gh api -X POST "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="$TAG" \
            -q .body 2>/dev/null || echo "")

          # Everything from "## New Contributors" onwards already includes the
          # "Full Changelog" link as its last line. Fall back to just the link
          # if no first-time contributors were detected.
          APPENDIX=$(echo "$AUTO" | sed -n '/^## New Contributors$/,$p')
          if [ -z "$APPENDIX" ]; then
            APPENDIX=$(echo "$AUTO" | grep '^\*\*Full Changelog\*\*' | tail -1)
          fi

          # 3. Artifact orientation footer — what each downloadable file is and
          # how to verify it. Kept at the bottom so it doesn't push the actual
          # release notes below the fold.
          FOOTER=$(cat <<EOF
          ### Artifacts

          - \`${BIN_NAME}\` — static Linux x86_64 binary (\`x86_64-unknown-linux-musl\`), no runtime dependencies.
          - \`${BIN_NAME}.sha256\` — checksum for the binary above.

          Verify before installing:

          \`\`\`sh
          sha256sum -c ${BIN_NAME}.sha256
          \`\`\`

          The binary must be owned by root and setuid (\`chown root:root\`, \`chmod 4755\`) — the Selynt Panel installer does this for you.
          EOF
          )

          {
            echo "$BODY"
            if [ -n "$APPENDIX" ]; then
              echo ""
              echo "---"
              echo ""
              echo "$APPENDIX"
            fi
            echo ""
            echo "---"
            echo ""
            echo "$FOOTER"
          } > release_body.md

          cat release_body.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          name: ${{ github.ref_name }}
          body_path: release_body.md
          files: |
            dist/${{ env.BIN_NAME }}
            dist/${{ env.BIN_NAME }}.sha256
          draft: false
          prerelease: ${{ steps.prerelease.outputs.is_prerelease }}
